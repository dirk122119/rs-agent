[package]
name = "rs-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rmcp = { version = "2.2.0", default-features = false, features = ["client", "transport-child-process"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
